name: Keep Backend Alive

on:
  schedule:
    # Runs every 15 minutes to prevent server cold starts
    - cron: "*/15 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping home API (en)
        run: |
          echo "Pinging backend to prevent cold start..."
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s" \
            --max-time 60 \
            "https://admin.egimedical.com/api/v1/categories?lang=en" \
            || echo "Ping timed out (server may be warming up)"

      - name: Ping home API (ar)
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s" \
            --max-time 60 \
            "https://admin.egimedical.com/api/v1/categories?lang=ar" \
            || echo "Ping timed out (server may be warming up)"
